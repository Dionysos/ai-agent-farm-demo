# Dev only: self-signed certificate, access by IP (no SNI -> default_server)
server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/dev.pem;   # self-signed
    ssl_certificate_key /etc/nginx/certs/dev.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 256m;   # OpenProject files

    location / {
        include /etc/nginx/snippets/proxy-openproject.conf;
    }
}
