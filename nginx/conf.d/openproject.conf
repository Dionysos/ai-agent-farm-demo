# Reverse proxy in front of OpenProject, behind Cloudflare Tunnel.
# TLS is terminated by Cloudflare; cloudflared -> nginx is plain HTTP on the internal "tunnel" network.
server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Real visitor IP (for rate limiting and OpenProject logs), sent by cloudflared
set_real_ip_from 172.28.20.0/24;   # "tunnel" network, see docker-compose.yml
real_ip_header   CF-Connecting-IP;

# Anti brute-force
limit_req_zone $binary_remote_addr zone=op_login:10m rate=10r/m;

# Tout nom d'hôte inconnu : connexion fermée sans réponse
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;

    client_max_body_size 100m;   # Cloudflare limit on the free plan

    location = /login {
        limit_req zone=op_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy-openproject.conf;
    }

    location / {
        include /etc/nginx/snippets/proxy-openproject.conf;
    }
}
