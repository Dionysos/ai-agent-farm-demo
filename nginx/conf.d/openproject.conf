# TLS reverse proxy in front of OpenProject
server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Anti brute-force
limit_req_zone $binary_remote_addr zone=op_login:10m rate=10r/m;

# Tout nom d'hôte inconnu : handshake TLS refusé
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    http2 on;
    server_name openproject.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;   # ex. Let's Encrypt
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 256m;   # OpenProject files

    location = /login {
        limit_req zone=op_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy-openproject.conf;
    }

    location / {
        include /etc/nginx/snippets/proxy-openproject.conf;
    }
}
